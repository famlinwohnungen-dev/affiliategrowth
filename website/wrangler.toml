# Cloudflare Workers mit statischen Assets.
#
# Hinweis zur Historie: Ursprünglich war das ein Pages-Projekt. Cloudflare
# migriert Pages zu Workers — neue Git-Verbindungen im Dashboard legen
# automatisch ein Workers-Projekt an. Diese Konfiguration folgt dem neuen Weg.
#
# Es gibt bewusst KEINEN `main`-Entrypoint: Die Seite ist rein statisch, es
# läuft kein Worker-Code. Cloudflare liefert dann ausschließlich die Dateien
# aus `dist/` aus ("assets-only Worker").
#
# Im Dashboard muss zusätzlich gesetzt sein (Settings → Build):
#   Root directory:  website
#   Build command:   npm run build
# Ohne das Root-Verzeichnis baut Cloudflare im Repo-Wurzelverzeichnis, wo kein
# Node-Projekt liegt — genau daran ist der erste Build gescheitert.

name = "affiliategrowth"
compatibility_date = "2026-09-11"

[assets]
directory = "./dist"

# `_headers` und `_redirects` in `public/` werden von Workers Static Assets
# genauso ausgewertet wie zuvor bei Pages.
